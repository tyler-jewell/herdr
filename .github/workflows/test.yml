# macos runs on the self-hosted studio. linux is the hosted backup and always runs,
# so a public push still has a result when the studio is offline or hosted minutes are gone.
name: test
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno run --quiet --allow-run --allow-read --allow-write --allow-net --allow-env ./evals.ts linux
  macos:
    name: macos
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: |
          export PATH="/opt/homebrew/bin:$PATH"
          deno run --quiet --allow-run --allow-read --allow-write --allow-net --allow-env ./evals.ts macos
