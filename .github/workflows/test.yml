# Purpose: run ./evals.ts on every push: macos on the self-hosted Mac runner, linux on hosted Ubuntu as the
#   backup, so a public push still has a result when that runner is offline.
# Change when: a runner, a pinned action, or the eval command changes.
# Not for: what is checked (checks.ts). The agent eval is local only and never runs here.
name: test
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno run --quiet --allow-run --allow-read --allow-write --allow-net --allow-env ./evals.ts linux
  macos:
    name: macos
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: |
          export PATH="/opt/homebrew/bin:$PATH"
          deno run --quiet --allow-run --allow-read --allow-write --allow-net --allow-env ./evals.ts macos
